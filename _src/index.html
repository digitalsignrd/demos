<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0B0F10">
<title>Demos · Digital Sign RD</title>
<meta name="description" content="Demos de los juegos y experiencias interactivas que Digital Sign RD desarrolla para tótems digitales en eventos y activaciones de marca.">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0B0F10;color:#E8ECEA;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
a{color:inherit;text-decoration:none}
main{max-width:860px;margin:0 auto;padding:72px 24px 80px}
.k{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#6B766F;margin-bottom:40px}
.k b{color:#C9D1CC;font-weight:600}
h1{font-size:clamp(28px,4.5vw,44px);font-weight:600;letter-spacing:-.02em;line-height:1.1;margin:0 0 12px}
.sub{color:#8A958E;font-size:16px;line-height:1.5;margin:0 0 48px;max-width:560px}
.lista{display:flex;flex-direction:column;border-top:1px solid #1C2220}
.item{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:22px 0;border-bottom:1px solid #1C2220;transition:padding-left .15s}
.item:hover{padding-left:8px}
.item .c{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#6B766F;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.item .c i{width:8px;height:8px;border-radius:50%;background:var(--c,#85BB66)}
.item h2{margin:0;font-size:20px;font-weight:600}
.item .ev{color:#8A958E;font-size:14px;margin-top:4px}
.item .go{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9AA59E;border:1px solid #242927;border-radius:999px;padding:9px 14px;white-space:nowrap}
.item:hover .go{color:#E8ECEA;border-color:#3a4441}
.vacio{color:#6B766F;padding:40px 0}
footer{margin-top:56px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6B766F;display:flex;gap:18px;flex-wrap:wrap}
footer a:hover{color:#E8ECEA}
</style>
</head>
<body>
<main>
  <div class="k"><b>Digital Sign RD</b> · Demos</div>
  <h1>Pruebe su experiencia interactiva antes del evento.</h1>
  <p class="sub">Ábrala en su computadora o celular, recórrala completa y envíenos sus comentarios. Lo que ve aquí es exactamente lo que correrá en el tótem.</p>
  <div class="lista">
    {{CARDS}}
  </div>
  <footer><a href="https://digitalsignrd.com">digitalsignrd.com</a><a href="mailto:digitalsignrd@gmail.com">digitalsignrd@gmail.com</a><span>Santo Domingo, RD</span></footer>
</main>
</body>
</html>
